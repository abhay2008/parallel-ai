[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-ai"
version = "0.2.0"
authors = [
  { name="Abhay Kashyap", email="abhaykashyap2008@gmail.com" },
]
description = "Tri-engine parallel AI orchestrator with autonomous self-healing execution loops, dynamic pattern memory, and zero-copy lock-free IPC broker"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "litellm>=1.40.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
pai = "parallel_router:main"
smart-router = "smart_router:main"
zero-broker = "zero_broker:main"
agent-mgr = "agent_manager:main"
